# ---------- Values we read in our code (nothing is hardcoded) ----------
app.name=Movie Catalog Service
app.version=1.0.0
catalog.max-genres-per-movie=5
catalog.default-rating=5.0

# ---------- In-memory H2 database ----------
spring.datasource.url=jdbc:h2:mem:catalogdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ---------- JPA ----------
# create the tables automatically from our entity classes
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
